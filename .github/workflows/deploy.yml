name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          missing=()
          [ -z "$VPS_HOST" ] && missing+=("VPS_HOST")
          [ -z "$VPS_USER" ] && missing+=("VPS_USER")
          [ -z "$VPS_SSH_KEY" ] && missing+=("VPS_SSH_KEY")
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required GitHub Secrets: ${missing[*]}"
            echo "See DEPLOY_SETUP.md in the repo for setup instructions."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Set up SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          # Trim any whitespace/newlines accidentally pasted into secrets
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_PORT="$(printf '%s' "${VPS_PORT:-}" | tr -d '[:space:]')"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${VPS_PORT:-22}"
          echo "Scanning host key for $VPS_HOST on port $port..."
          ssh-keyscan -p "$port" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned no host key. Check VPS_HOST and that SSH is reachable on port $port."
            exit 1
          fi
          echo "SSH key and known_hosts configured."

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        run: |
          set -euo pipefail
          # Trim any whitespace/newlines accidentally pasted into secrets
          VPS_HOST="$(printf '%s' "$VPS_HOST" | tr -d '[:space:]')"
          VPS_USER="$(printf '%s' "$VPS_USER" | tr -d '[:space:]')"
          VPS_PORT="$(printf '%s' "${VPS_PORT:-}" | tr -d '[:space:]')"
          VPS_APP_PATH="$(printf '%s' "${VPS_APP_PATH:-}" | tr -d '[:space:]')"
          PM2_APP_NAME="$(printf '%s' "${PM2_APP_NAME:-}" | tr -d '[:space:]')"
          port="${VPS_PORT:-22}"
          app_path="${VPS_APP_PATH:-/var/www/portal}"
          pm2_name="${PM2_APP_NAME:-portal}"
          commit="${GITHUB_SHA:-HEAD}"

          echo "Deploying commit $commit to $VPS_USER@$VPS_HOST:$app_path"
          echo "PM2 process: $pm2_name"

          ssh -i ~/.ssh/deploy_key \
              -p "$port" \
              -o StrictHostKeyChecking=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "$VPS_USER@$VPS_HOST" \
              "APP_PATH='$app_path' PM2_NAME='$pm2_name' TARGET_COMMIT='$commit' bash -s" <<'REMOTE'
          set -euo pipefail

          echo "--- VPS deploy started at $(date -u +%FT%TZ) ---"
          cd "$APP_PATH"

          echo "--- git fetch + reset to origin/main ---"
          git fetch --prune origin main
          git reset --hard origin/main
          echo "HEAD is now: $(git rev-parse HEAD)"

          # The live app keeps serving from node_modules + .next during the whole
          # build. Reinstalling or rebuilding those in place made every deploy
          # throw "Cannot find module" 500s for a minute or two.

          lock_hash="$(sha256sum package-lock.json | cut -d' ' -f1)"
          if [ ! -d node_modules ] || [ "$(cat .deploy-lock-hash 2>/dev/null)" != "$lock_hash" ]; then
            echo "--- npm ci (package-lock.json changed) ---"
            npm ci --prefer-offline --no-audit --no-fund
            echo "$lock_hash" > .deploy-lock-hash
          else
            echo "--- package-lock.json unchanged: keeping node_modules ---"
          fi

          echo "--- next build into .next-build (live .next keeps serving) ---"
          rm -rf .next-build
          NEXT_DIST_DIR=.next-build npm run build

          if ! pm2 describe "$PM2_NAME" >/dev/null 2>&1; then
            echo "::error::PM2 process '$PM2_NAME' not found. Run the one-time setup in DEPLOY_SETUP.md."
            exit 1
          fi

          echo "--- swap build + pm2 restart $PM2_NAME ---"
          rm -rf .next-prev
          if [ -d .next ]; then mv .next .next-prev; fi
          mv .next-build .next
          pm2 restart "$PM2_NAME" --update-env --time

          echo "--- health check ---"
          healthy=""
          for i in $(seq 1 15); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/ || true)"
            if [ "$code" = "200" ]; then healthy="yes"; break; fi
            sleep 2
          done
          if [ -z "$healthy" ]; then
            echo "::error::New build did not answer 200 on :3001 (last code: $code). Rolling back to the previous build."
            if [ -d .next-prev ]; then
              rm -rf .next-failed
              mv .next .next-failed
              mv .next-prev .next
              pm2 restart "$PM2_NAME" --update-env --time
            fi
            exit 1
          fi
          pm2 save >/dev/null

          echo "--- pm2 status ---"
          pm2 status "$PM2_NAME"
          rm -rf .next-prev .next-failed

          echo "--- deploy finished OK at $(date -u +%FT%TZ) ---"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
